org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
net.minecraftforge.gradle.merge-source-sets=false
# 指向本地 JDK 25 + JDK 8 安装路径，供 toolchain 自动检测
org.gradle.java.installations.paths=D:/jdk-25.0.4+7,D:/jdk8-extract/jdk8u502-b07
# mcmaven 子进程通过 JVM 系统属性查找 JDK，需 systemProp 前缀透传
systemProp.org.gradle.java.installations.paths=D:/jdk-25.0.4+7,D:/jdk8-extract/jdk8u502-b07
systemProp.org.gradle.java.installations.fromEnv=JAVA_HOME_8

# MC 26.2 + Forge 65.1.0
minecraft_version=26.2
minecraft_version_range=[26.2,27)
forge_version=65.1.0
forge_version_range=[65,)
loader_version_range=[24,]
mod_id=pcbcraft
mod_name=PCBcraft
mod_license=MIT
mod_version=0.3.0
mod_group_id=com.pcbcraft
mod_authors=PCBcraft Team
mod_description=In-game PCB design and electrical simulation mod (Forge 65.1.0 / MC 26.2 port).
